<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="工作台" />
<meta name="theme-color" content="#a24870" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>工作台</title>
<style>
  :root {
    --paper: #eef1ec;
    --paper-raised: #ffffff;
    --paper-sunken: #e4e9e1;
    --ink: #1e2a22;
    --ink-soft: #5b6960;
    --ink-faint: #8a978e;
    --line: #d6dcd1;
    --accent-task: #1f6f5c;
    --accent-task-soft: #dfeee9;
    --accent-idea: #b8811f;
    --accent-idea-soft: #f6ecd4;
    --accent-habit: #a24870;
    --accent-habit-soft: #f4e2ea;
    --accent-time: #2f5f86;
    --accent-time-soft: #dde7ef;
    --accent-purple: #6a4c93;
    --accent-purple-soft: #e6dff5;
    --accent-terra: #b0522a;
    --accent-terra-soft: #f7e0d2;
    --accent-green: #2f7a4f;
    --accent-green-soft: #dcefe1;
    --accent-pink: #b3394c;
    --accent-pink-soft: #fbe0e4;
    --danger: #a24d3c;
    --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
    --radius-card: 14px;
    --radius-control: 9px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141813;
      --paper-raised: #1d221e;
      --paper-sunken: #191d17;
      --ink: #e7ece5;
      --ink-soft: #99a69b;
      --ink-faint: #6c766e;
      --line: #2b3129;
      --accent-task: #55c1a3;
      --accent-task-soft: #1c3730;
      --accent-idea: #e8b750;
      --accent-idea-soft: #3a3020;
      --accent-habit: #e592b8;
      --accent-habit-soft: #3a2430;
      --accent-time: #6fa8d8;
      --accent-time-soft: #22323f;
      --accent-purple: #b79ee0;
      --accent-purple-soft: #332a45;
      --accent-terra: #e0916a;
      --accent-terra-soft: #3d281c;
      --accent-green: #6fcf97;
      --accent-green-soft: #1e3327;
      --accent-pink: #e88a9a;
      --accent-pink-soft: #3a2229;
      --danger: #e08b74;
      --danger-soft: #3a2621;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141813;
    --paper-raised: #1d221e;
    --paper-sunken: #191d17;
    --ink: #e7ece5;
    --ink-soft: #99a69b;
    --ink-faint: #6c766e;
    --line: #2b3129;
    --accent-task: #55c1a3;
    --accent-task-soft: #1c3730;
    --accent-idea: #e8b750;
    --accent-idea-soft: #3a3020;
    --accent-habit: #e592b8;
    --accent-habit-soft: #3a2430;
    --accent-time: #6fa8d8;
    --accent-time-soft: #22323f;
    --accent-purple: #b79ee0;
    --accent-purple-soft: #332a45;
    --accent-terra: #e0916a;
    --accent-terra-soft: #3d281c;
    --accent-green: #6fcf97;
    --accent-green-soft: #1e3327;
    --accent-pink: #e88a9a;
    --accent-pink-soft: #3a2229;
    --danger: #e08b74;
    --danger-soft: #3a2621;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #eef1ec;
    --paper-raised: #ffffff;
    --paper-sunken: #e4e9e1;
    --ink: #1e2a22;
    --ink-soft: #5b6960;
    --ink-faint: #8a978e;
    --line: #d6dcd1;
    --accent-task: #1f6f5c;
    --accent-task-soft: #dfeee9;
    --accent-idea: #b8811f;
    --accent-idea-soft: #f6ecd4;
    --accent-habit: #a24870;
    --accent-habit-soft: #f4e2ea;
    --accent-time: #2f5f86;
    --accent-time-soft: #dde7ef;
    --accent-purple: #6a4c93;
    --accent-purple-soft: #e6dff5;
    --accent-terra: #b0522a;
    --accent-terra-soft: #f7e0d2;
    --accent-green: #2f7a4f;
    --accent-green-soft: #dcefe1;
    --accent-pink: #b3394c;
    --accent-pink-soft: #fbe0e4;
    --danger: #a24d3c;
    --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 4px 22px;
    flex-wrap: wrap;
  }

  header.top h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }

  header.top .date {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .tabbar {
    display: flex;
    gap: 4px;
    width: fit-content;
    padding: 4px;
    margin: 0 0 20px;
    background: var(--paper-sunken);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .tab-btn {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 9px;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    background: var(--paper-raised);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  main.board {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  main.board[hidden] {
    display: none;
  }

  section.panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }

  .panel-head .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 5px;
  }
  .panel--task .tag { color: var(--accent-task); background: var(--accent-task-soft); }
  .panel--idea .tag { color: var(--accent-idea); background: var(--accent-idea-soft); }
  .panel--habit .tag { color: var(--accent-habit); background: var(--accent-habit-soft); }

  .panel-head h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }

  .count-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .copy-all {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .panel--idea .copy-all:hover { color: var(--accent-idea); border-color: var(--accent-idea); background: var(--accent-idea-soft); }

  .add-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-sunken);
    align-items: flex-end;
  }

  .add-row.stacked {
    flex-direction: column;
    align-items: stretch;
  }

  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .add-row input[type="text"], .add-row textarea {
    flex: 1 1 140px;
    min-width: 0;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-control);
    padding: 9px 11px;
    resize: none;
  }
  .add-row textarea { min-height: 40px; max-height: 120px; }

  .date-input {
    font: inherit;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-control);
    padding: 8px 9px;
    width: 132px;
    flex-shrink: 0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { .date-input { color-scheme: dark; } }
  :root[data-theme="dark"] .date-input { color-scheme: dark; }
  :root[data-theme="light"] .date-input { color-scheme: light; }

  select.date-input {
    cursor: pointer;
    width: auto;
    max-width: 150px;
  }

  .habit-backfill-date {
    width: 108px;
  }

  .row-date {
    align-self: center;
    width: 78px;
    padding: 5px 7px;
    font-size: 12px;
  }
  .row-date.has-date {
    color: var(--accent-task);
    border-color: var(--accent-task);
    background: var(--accent-task-soft);
    font-weight: 600;
  }

  .date-field {
    position: relative;
  }
  .date-field-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    opacity: 0;
    cursor: pointer;
  }
  .date-field-text {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    white-space: nowrap;
    pointer-events: none;
  }
  .date-field-text.placeholder { color: var(--ink-faint); }
  .date-field:focus-within {
    outline: 2px solid var(--accent-task);
    outline-offset: 2px;
  }

  #task-date-field { width: 78px; }

  .add-row input:focus-visible,
  .add-row select:focus-visible,
  .add-row textarea:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent-task);
    outline-offset: 2px;
  }
  .panel--idea .add-row input:focus-visible,
  .panel--idea .add-row textarea:focus-visible { outline-color: var(--accent-idea); }
  .panel--habit .add-row input:focus-visible,
  .panel--habit .add-row select:focus-visible { outline-color: var(--accent-habit); }
  .day-card input:focus-visible,
  .day-card select:focus-visible,
  .week-nav-btn:focus-visible {
    outline: 2px solid var(--accent-time);
    outline-offset: 2px;
  }

  .add-btn {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: var(--radius-control);
    padding: 9px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s, transform 0.05s;
  }
  .add-btn:active { transform: translateY(1px); }
  .panel--task .add-btn { background: var(--accent-task); }
  .panel--idea .add-btn { background: var(--accent-idea); }
  .panel--habit .add-btn { background: var(--accent-habit); }
  .panel--schedule .add-btn { background: var(--accent-time); }
  .add-btn:hover { filter: brightness(1.08); }

  ul.item-list {
    list-style: none;
    margin: 0;
    padding: 6px 8px;
  }

  li.item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 9px;
    transition: background 0.12s;
  }
  li.item:hover { background: var(--paper-sunken); }

  .check {
    appearance: none;
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    border-radius: 6px;
    border: 1.5px solid var(--ink-faint);
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    background: var(--paper-raised);
  }
  .check:checked { background: var(--accent-task); border-color: var(--accent-task); }
  .check:checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .item-text {
    flex: 1;
    font-size: 14.5px;
    word-break: break-word;
    white-space: pre-wrap;
    padding-top: 1px;
  }
  li.item.done .item-text { color: var(--ink-faint); text-decoration: line-through; }

  .idea-text {
    flex: 1;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .idea-meta {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  .idea-edit-textarea {
    flex: 1;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--accent-idea);
    border-radius: var(--radius-control);
    padding: 8px 10px;
    resize: vertical;
  }
  .idea-edit-textarea:focus-visible {
    outline: 2px solid var(--accent-idea);
    outline-offset: 1px;
  }

  .item-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .panel--idea .item-actions {
    flex-direction: column;
    gap: 4px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--ink-faint);
    border-radius: 7px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color 0.15s, background 0.15s;
  }
  .icon-btn:hover { background: var(--paper-sunken); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
  .icon-btn svg { width: 15px; height: 15px; }

  .done-toggle {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 9px 18px;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .done-toggle:hover { color: var(--ink); }

  .habit-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 10px;
  }
  @media (min-width: 860px) {
    .habit-list { grid-template-columns: repeat(3, 1fr); }
  }

  .habit-card {
    display: flex;
    min-width: 0;
    padding: 8px 9px;
    border-radius: 10px;
    background: var(--paper-sunken);
    border: 1px solid var(--line);
    transition: border-color 0.12s;
  }
  .habit-card:hover { border-color: var(--accent-habit); }

  .habit-top {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    width: 100%;
  }

  .habit-top .icon-btn {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .habit-top .icon-btn svg {
    width: 11px;
    height: 11px;
  }

  .habit-date {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .habit-date.good { color: var(--accent-task); }
  .habit-date.warn { color: var(--danger); }
  .habit-date.neutral { color: var(--ink-soft); font-weight: 500; }

  .habit-toggle {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--ink-faint);
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    background: var(--paper-raised);
  }
  .habit-toggle.checked { background: var(--accent-habit); border-color: var(--accent-habit); }
  .habit-toggle.checked::after {
    content: "";
    position: absolute;
    left: 4.5px; top: 1.5px;
    width: 5px; height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .habit-name {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .panel--schedule .tag { color: var(--accent-time); background: var(--accent-time-soft); }

  .week-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-sunken);
  }

  .week-nav-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .week-nav-btn:hover { border-color: var(--accent-time); color: var(--accent-time); }

  .week-info {
    text-align: center;
    min-width: 0;
  }

  .week-range {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .week-total-inline {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .week-total-inline #week-total-hours {
    font-weight: 700;
    color: var(--accent-time);
  }

  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
  }

  .day-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 11px 13px;
    border-radius: 11px;
    background: var(--paper-sunken);
    border: 1px solid var(--line);
  }
  .day-card.is-today {
    border-color: var(--accent-time);
    background: var(--accent-time-soft);
  }

  .day-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .day-label {
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .day-card.is-today .day-label { color: var(--accent-time); }

  .day-total {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .day-rest-text {
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .shift-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .shift-block:first-of-type {
    padding-top: 0;
    border-top: none;
  }

  .shift-top {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .shift-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent-time);
    flex: 1;
    min-width: 0;
  }

  .shift-top .icon-btn {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
  .shift-top .icon-btn svg {
    width: 13px;
    height: 13px;
  }

  .add-shift-btn {
    align-self: flex-start;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-time);
    background: var(--accent-time-soft);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .add-shift-btn:hover { filter: brightness(0.95); }

  .break-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .break-toggle input {
    width: 14px;
    height: 14px;
    accent-color: var(--accent-time);
    cursor: pointer;
  }
  .holiday-toggle input { accent-color: var(--accent-idea); }
  .holiday-toggle.checked { color: var(--accent-idea); font-weight: 600; }

  .day-times {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .time-input {
    width: auto;
    flex: 1 1 0;
    min-width: 0;
  }

  .time-sep {
    color: var(--ink-faint);
    font-size: 13px;
    flex-shrink: 0;
  }

  .location-input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-control);

  }

  .day-computed {

  .day-computed.rest { color: var(--ink-faint); }
  .day-computed .holiday-tag { color: var(--accent-idea); font-weight: 600; }

  .day-bottom {

  }
  .day-bottom .location-select {
    flex-shrink: 0;
  }

  }

  .location-manager {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-sunken);
  }

  .location-manager input[type="text"] {
    flex: 1 1 140px;
    min-width: 0;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);

    border: 1px solid var(--line);

  .location-manager input[type="text"]:focus-visible { outline: 2px solid var(--accent-time); outline-offset: 2px; }

  .location-manager-label {

  .location-chips {

  .location-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 6px 5px 10px;
    border-radius: 20px;
  }

  .location-chip-del {
    width: 17px;
    height: 17px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.12);

  .mini-cal {
    padding: 14px 18px 18px;
    border-bottom: 1px solid var(--line);
  }

  .mini-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .mini-cal-weekdays span {
    text-align: center;
    font-size: 10.5px;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .mini-cal-week + .mini-cal-week { margin-top: 10px; }

  .mini-cal-week-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  .mini-cal-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .mini-day {
    min-height: 54px;
    border-radius: 8px;
    border: 1px solid var(--line);

    padding: 4px 2px;

  .mini-day.rest { background: transparent; border-style: dashed; }

  .mini-day-num {

  .mini-day-line {
    font-size: 9px;

  }

  .panel--storage .tag { color: var(--accent-purple); background: var(--accent-purple-soft); }
  .panel--storage .add-btn { background: var(--accent-purple); }
  .panel--storage .add-row input:focus-visible,
  .panel--storage .add-row select:focus-visible { outline-color: var(--accent-purple); }

  .stock-alert {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
  }
  .stock-alert[hidden] { display: none; }

  .stock-num-input {
    width: 56px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    text-align: center;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-control);
    padding: 6px 4px;
  }

  .photo-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-control);

    cursor: pointer;
    white-space: nowrap;

  .photo-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple); }
  .photo-btn input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .photo-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .photo-preview-thumb {
    width: 36px;
    height: 36px;
    border-radius: 8px;

  .stock-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;

  }
  @media (min-width: 560px) {
    .stock-grid { grid-template-columns: repeat(2, 1fr); }

  @media (min-width: 860px) {

  .stock-card {
    display: flex;

  .stock-expiry.soon { color: var(--accent-idea); }

    padding: 26px 20px 30px;

    color: var(--ink-faint);

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(12px);

    font-weight: 600;
    padding: 9px 16px;

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>工作台</h1>
    <span class="date" id="today"></span>
  </header>

  <nav class="tabbar" role="tablist" aria-label="页面切换">
    <button type="button" class="tab-btn" data-tab="tasks" role="tab">工作台</button>
    <button type="button" class="tab-btn" data-tab="schedule" role="tab">排班</button>
    <button type="button" class="tab-btn" data-tab="storage" role="tab">储物</button>
  </nav>

  <main class="board" id="view-tasks">
    <section class="panel panel--task" aria-labelledby="task-heading">
      <div class="panel-head">
        <span class="tag">TO-DO</span>
        <h2 id="task-heading">待办事项</h2>
        <span class="count-chip" id="task-count">0 项</span>
      </div>
      <form class="add-row" id="task-form">
        <input type="text" id="task-input" placeholder="添加一项待办…" autocomplete="off" maxlength="240" />
        <span class="date-input date-field" id="task-date-field">
          <span class="date-field-text placeholder" id="task-date-text">月/日</span>
          <input type="date" id="task-date" class="date-field-input" aria-label="日期（可选）" />
        </span>
        <button type="submit" class="add-btn">添加</button>
      </form>
      <ul class="item-list" id="task-list"></ul>
      <div class="empty" id="task-empty">还没有待办事项，从上面输入开始吧</div>
      <button class="done-toggle" id="task-done-toggle" hidden></button>
    </section>

    <section class="panel panel--idea" aria-labelledby="idea-heading">
      <div class="panel-head">
        <span class="tag">SPARK</span>
        <h2 id="idea-heading">灵感速记</h2>
        <span class="count-chip" id="idea-count">0 条</span>
        <button class="copy-all" id="idea-copy-all">复制全部</button>
      </div>
      <form class="add-row" id="idea-form">
        <textarea id="idea-input" placeholder="随手记一笔想法…" maxlength="2000" rows="1"></textarea>
        <button type="submit" class="add-btn">记录</button>
      </form>
      <ul class="item-list" id="idea-list"></ul>
      <div class="empty" id="idea-empty">灵感还是空的，捕捉到什么就写下来</div>
    </section>

    <section class="panel panel--habit" aria-labelledby="habit-heading">
      <div class="panel-head">
        <span class="tag">STREAK</span>
        <h2 id="habit-heading">小习惯</h2>
        <span class="count-chip" id="habit-count">0 个</span>
      </div>
      <div class="add-row stacked">
        <form class="toolbar-row" id="habit-form">
          <input type="text" id="habit-input" placeholder="添加一个小习惯…" autocomplete="off" maxlength="60" />
          <button type="submit" class="add-btn">添加</button>
        </form>
        <div class="toolbar-row">
          <select id="habit-backfill-select" class="date-input" aria-label="选择习惯"></select>
          <input type="date" id="habit-backfill-date" class="date-input habit-backfill-date" aria-label="补录日期" />
          <button type="button" id="habit-backfill-btn" class="add-btn">补录</button>
        </div>
      </div>
      <div class="habit-list" id="habit-list"></div>
      <div class="empty" id="habit-empty">还没有习惯，从上面输入开始记录</div>
    </section>
  </main>

  <main class="board" id="view-schedule" hidden>
    <section class="panel panel--schedule" aria-labelledby="schedule-heading">
      <div class="panel-head">
        <span class="tag">SHIFT</span>
        <h2 id="schedule-heading">排班</h2>
      </div>
      <div class="location-manager">
        <p class="location-manager-label">工作地点 / 部门</p>
        <form class="toolbar-row" id="location-form">
          <input type="text" id="location-input" placeholder="新增一个地点或部门…" autocomplete="off" maxlength="30" />
          <button type="submit" class="add-btn">添加</button>
        </form>
        <div class="location-chips" id="location-chips"></div>
      </div>
      <div class="mini-cal">
        <div class="mini-cal-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="mini-cal-weeks"></div>
      </div>
      <div class="week-bar">
        <button type="button" class="week-nav-btn" id="week-prev" aria-label="上一周">‹</button>
        <div class="week-info">
          <div class="week-range"><span id="week-number"></span><span class="week-total-inline"> · <span id="week-total-hours">0</span> 小时</span></div>
        </div>
        <button type="button" class="week-nav-btn" id="week-next" aria-label="下一周">›</button>
      </div>
      <div class="day-list" id="day-list"></div>
    </section>
  </main>

  <main class="board" id="view-storage" hidden>
    <section class="panel panel--storage" aria-labelledby="storage-heading">
      <div class="panel-head">
        <span class="tag">STOCK</span>
        <h2 id="storage-heading">储物</h2>
        <span class="count-chip" id="item-count">0 件</span>
      </div>
      <div class="add-row stacked">
        <form id="item-form">
          <div class="toolbar-row">
            <input type="text" id="item-name" placeholder="物品名称…" autocomplete="off" maxlength="40" />
            <input type="number" id="item-qty" class="stock-num-input" min="0" step="1" value="1" aria-label="数量" />
          </div>
          <div class="toolbar-row">
            <input type="date" id="item-buy-date" class="date-input" aria-label="购买日期（可选）" />
            <input type="date" id="item-expiry-date" class="date-input" aria-label="过期日期（可选）" />
          </div>
          <div class="toolbar-row">
            <select id="item-location" class="date-input" aria-label="储存地点">
              <option value="旅行箱">旅行箱</option>
              <option value="储物箱">储物箱</option>
              <option value="桌柜">桌柜</option>
            </select>
            <select id="item-category" class="date-input" aria-label="物品类型">
              <option value="调料">调料</option>
              <option value="日常">日常</option>
              <option value="旅行">旅行</option>
            </select>
          </div>
          <div class="toolbar-row">
            <label class="photo-btn">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="15" height="11" rx="2"/><circle cx="10" cy="10.5" r="3"/><path d="M7.5 5l1-1.8h3l1 1.8"/></svg>
              添加照片
              <input type="file" id="item-photo-input" accept="image/*" />
            </label>
            <img id="item-photo-preview" class="photo-preview-thumb" hidden />
            <button type="submit" class="add-btn">添加</button>
          </div>
        </form>
      </div>
      <div class="stock-alert" id="stock-alert" hidden></div>
      <div class="stock-grid" id="stock-grid"></div>
      <div class="empty" id="item-empty">还没有储存物品，从上面添加开始记录</div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORE_TASKS = "workbench.tasks.v1";
  const STORE_IDEAS = "workbench.ideas.v1";
  const STORE_HABITS = "workbench.habits.v1";
  const HABITS_SEED_FLAG = "workbench.habits.seeded.v1";
  const STORE_SCHEDULE = "workbench.schedule.v1";
  const STORE_LOCATIONS = "workbench.locations.v1";
  const STORE_TAB = "workbench.activeTab.v1";
  const STORE_ITEMS = "workbench.items.v1";
  const LOCATION_BADGE_COLOR = { "旅行箱": "terra", "储物箱": "time", "桌柜": "green" };
  const CATEGORY_BADGE_COLOR = { "调料": "idea", "日常": "task", "旅行": "pink" };
  const LOCATION_PALETTE = ["task", "idea", "habit", "time", "purple", "terra", "green", "pink"];

  const load = (key) => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  };
  const save = (key, data) => localStorage.setItem(key, JSON.stringify(data));

  let tasks = load(STORE_TASKS);
  let ideas = load(STORE_IDEAS);
  let showDone = false;

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function seedHabits() {
    return [
      { id: uid(), name: "泥膜🫧", dates: ["2026-03-21", "2026-07-12"] },
      { id: uid(), name: "洗头", dates: ["2026-07-06", "2026-07-12", "2026-07-18", "2026-07-24"] },
      { id: uid(), name: "湿敷", dates: ["2026-07-10", "2026-07-16"] },
      { id: uid(), name: "记账", dates: ["2026-07-09", "2026-07-17"] },
      { id: uid(), name: "运动", dates: ["2026-07-08", "2026-07-09"] },
      { id: uid(), name: "面膜", dates: ["2026-07-12", "2026-07-26"] },
    ];
  }

  let habits = load(STORE_HABITS);
  if (!localStorage.getItem(HABITS_SEED_FLAG)) {
    habits = seedHabits();
    save(STORE_HABITS, habits);
    localStorage.setItem(HABITS_SEED_FLAG, "1");
  }

  let schedule = (() => {
    try {
      const raw = localStorage.getItem(STORE_SCHEDULE);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  })();
  const saveSchedule = () => localStorage.setItem(STORE_SCHEDULE, JSON.stringify(schedule));

  let locations = load(STORE_LOCATIONS);
  const saveLocations = () => localStorage.setItem(STORE_LOCATIONS, JSON.stringify(locations));

  function addLocation(name) {
    const loc = { id: uid(), name, color: LOCATION_PALETTE[locations.length % LOCATION_PALETTE.length] };
    locations.push(loc);
    saveLocations();
    return loc;
  }

  function ensureLocation(name) {
    let loc = locations.find(l => l.name === name);
    if (!loc) loc = addLocation(name);
    return loc;
  }
  const defaultLocation = ensureLocation("EL");

  (function migrateScheduleShape() {
    let changed = false;
    Object.keys(schedule).forEach(weekKey => {
      schedule[weekKey] = schedule[weekKey].map(day => {
        if (day.shifts) return day;
        changed = true;
        const hasRealShift = !!(day.start || day.end);
        let locationId = day.locationId || "";
        if (!locationId && day.location) locationId = ensureLocation(day.location).id;
        const shifts = hasRealShift ? [{
          id: uid(),
          start: day.start || "",
          end: day.end || "",
          hasBreak: !!day.hasBreak,
          isHoliday: !!day.isHoliday,
          locationId: locationId || defaultLocation.id,
        }] : [];
        return { date: day.date, shifts };
      });
    });
    if (changed) saveSchedule();
  })();

  (function applyDefaultLocation() {
    let changed = false;
    Object.values(schedule).forEach(week => week.forEach(day => {
      (day.shifts || []).forEach(sh => {
        if (!sh.locationId) { sh.locationId = defaultLocation.id; changed = true; }
      });
    }));
    if (changed) saveSchedule();
  })();

  let items = load(STORE_ITEMS);
  const saveItems = () => localStorage.setItem(STORE_ITEMS, JSON.stringify(items));

  function resizeImageFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 480;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function itemExpiryStatus(item) {
    if (!item.expiryDate) return { text: "无过期日期", kind: "neutral" };
    const daysLeft = daysBetween(todayISO(), item.expiryDate);
    if (daysLeft < 0) return { text: `已过期 ${-daysLeft} 天`, kind: "expired" };
    if (daysLeft === 0) return { text: "今天过期", kind: "soon" };
    if (daysLeft <= 7) return { text: `还有 ${daysLeft} 天过期`, kind: "soon" };
    return { text: `还有 ${daysLeft} 天过期`, kind: "fresh" };
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast("已复制")).catch(() => fallbackCopy(text));
    } else {

  function fallbackCopy(text) {

  function fmtTime(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtMonthDay(iso) {
    const [, m, d] = iso.split("-").map(Number);
    return `${m}/${d}`;
  }
  function syncDateFieldText(inputEl, textEl) {
    if (inputEl.value) {
      textEl.textContent = fmtMonthDay(inputEl.value);
      textEl.classList.remove("placeholder");
    } else {
      textEl.textContent = "月/日";
      textEl.classList.add("placeholder");

  }
  function makeCompactDateField(value, ariaLabel, extraClass) {
    const wrap = document.createElement("span");
    wrap.className = "date-input date-field" + (extraClass ? " " + extraClass : "");
    const text = document.createElement("span");
    text.className = "date-field-text";

    input.type = "date";
    input.className = "date-field-input";
    input.value = value || "";
    input.setAttribute("aria-label", ariaLabel);
    wrap.append(text, input);
    syncDateFieldText(input, text);
    wrap.input = input;
    wrap.textEl = text;
    return wrap;
  }

  function toISO(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function todayISO() { return toISO(new Date()); }
  function daysBetween(fromISO, toISOStr) {
    const [fy, fm, fd] = fromISO.split("-").map(Number);
    const [ty, tm, td] = toISOStr.split("-").map(Number);
    return Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
  }

  function isoOf(y, m, d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  function addDaysISO(iso, n) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return isoOf(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }
  function weekdayOfISO(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  }
  function mondayOfISO(iso) {
    const dow = weekdayOfISO(iso);
    return addDaysISO(iso, dow === 0 ? -6 : 1 - dow);
  }
  function weekDaysOf(startISO) {
    return Array.from({ length: 7 }, (_, i) => addDaysISO(startISO, i));
  }

  function habitStatus(h) {
    const dates = [...h.dates].sort();
    if (dates.length === 0) return { text: "还没有记录", last: "-", kind: "neutral", daysAgo: null };
    const last = dates[dates.length - 1];
    const daysAgo = daysBetween(last, todayISO());
    if (daysAgo <= 0) return { text: "今天已完成", last, kind: "good", daysAgo };
    if (daysAgo >= 5) return { text: `${daysAgo} 天前`, last, kind: "warn", daysAgo };
    return { text: `${daysAgo} 天前`, last, kind: "neutral", daysAgo };
  }

  function ensureWeek(key) {
    if (!schedule[key]) {
      schedule[key] = weekDaysOf(key).map(date => ({

        shifts: [{ id: uid(), start: "", end: "", hasBreak: false, isHoliday: false, locationId: defaultLocation.id }],
      }));

    return schedule[key];

  function roundToHalfHour(hhmm) {
    if (!hhmm) return hhmm;
    let [h, m] = hhmm.split(":").map(Number);
    if (m < 15) m = 0;
    else if (m < 45) m = 30;
    else { m = 0; h = (h + 1) % 24; }
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function computeShift(shift) {
    if (!shift.start || !shift.end) return { wake: null, hours: 0, isRest: true, isHoliday: false };
    const [sh, sm] = shift.start.split(":").map(Number);
    const [eh, em] = shift.end.split(":").map(Number);
    const startMin = sh * 60 + sm;
    let endMin = eh * 60 + em;
    if (endMin <= startMin) endMin += 24 * 60;
    let workMin = endMin - startMin;
    if (shift.hasBreak) workMin -= 30;
    workMin = Math.max(0, workMin);
    let hours = Math.round((workMin / 60) * 10) / 10;
    if (shift.isHoliday) hours = Math.round(hours * 2 * 10) / 10;
    let wakeMin = startMin - 90;
    if (wakeMin < 0) wakeMin += 24 * 60;
    const pad = (n) => String(n).padStart(2, "0");
    const wake = `${pad(Math.floor(wakeMin / 60))}:${pad(wakeMin % 60)}`;
    return { wake, hours, isRest: false, isHoliday: !!shift.isHoliday };
  }

  function dayTotalHours(dayEntry) {
    return (dayEntry.shifts || []).reduce((sum, sh) => sum + computeShift(sh).hours, 0);
  }

  function formatDayLabel(iso) {
    const names = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    const [, m, d] = iso.split("-").map(Number);
    return `${names[weekdayOfISO(iso)]} · ${m}/${d}`;
  }

  function isoWeekNumber(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
    return 1 + Math.round((date - firstThursday) / (7 * 86400000));
  }

  function formatWeekRange(startISO) {
    const endISO = addDaysISO(startISO, 6);
    const [, sm, sd] = startISO.split("-").map(Number);
    const [, em, ed] = endISO.split("-").map(Number);
    return `${sm}月${sd}日 – ${em}月${ed}日`;
  }

  function miniDayCell(dateISO, dayEntry) {
    const cell = document.createElement("div");
    const d = Number(dateISO.split("-")[2]);
    const isToday = dateISO === todayISO();
    const validShifts = (dayEntry.shifts || [])
      .map(sh => ({ sh, c: computeShift(sh) }))
      .filter(x => !x.c.isRest)
      .sort((a, b) => a.sh.start.localeCompare(b.sh.start));
    const isRestDay = validShifts.length === 0;
    cell.className = "mini-day" + (isRestDay ? " rest" : "") + (isToday ? " today" : "");
    if (!isRestDay) {
      const loc = locations.find(l => l.id === validShifts[0].sh.locationId);
      if (loc) {
        cell.style.background = `var(--accent-${loc.color}-soft)`;
        cell.style.borderColor = `var(--accent-${loc.color})`;
      }
    }
    const num = document.createElement("div");
    num.className = "mini-day-num";
    num.textContent = d;
    cell.appendChild(num);
    if (validShifts.length === 1) {
      const wake = document.createElement("div");
      wake.className = "mini-day-line";
      wake.textContent = validShifts[0].c.wake;
      const start = document.createElement("div");
      start.className = "mini-day-line";
      start.textContent = validShifts[0].sh.start;
      cell.append(wake, start);
    } else if (validShifts.length > 1) {
      validShifts.forEach(({ sh }) => {
        const line = document.createElement("div");
        line.className = "mini-day-line";
        line.textContent = sh.start;
        cell.appendChild(line);
      });
    }
    return cell;
  }

  function renderMiniCal() {
    const container = document.getElementById("mini-cal-weeks");
    container.innerHTML = "";
    const thisMonday = mondayOfISO(todayISO());
    const names = ["本周", "下周"];
    [0, 1].forEach(offset => {
      const start = addDaysISO(thisMonday, offset * 7);
      const weekEntries = schedule[start];
      const row = document.createElement("div");
      row.className = "mini-cal-week";
      const heading = document.createElement("div");
      heading.className = "mini-cal-week-label";
      heading.textContent = `${names[offset]} · ${formatWeekRange(start)}`;
      const daysRow = document.createElement("div");
      daysRow.className = "mini-cal-row";
      weekDaysOf(start).forEach((dateISO, i) => {
        const dayEntry = weekEntries ? weekEntries[i] : { date: dateISO, shifts: [] };
        daysRow.appendChild(miniDayCell(dateISO, dayEntry));
      });
      row.append(heading, daysRow);
      container.appendChild(row);
    });
  }

  document.getElementById("location-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("location-input");
    const name = input.value.trim();
    if (!name) return;
    addLocation(name);
    input.value = "";
    renderSchedule();
  });

  document.getElementById("week-prev").addEventListener("click", () => {
    viewedWeekStart = addDaysISO(viewedWeekStart, -7);
    renderSchedule();
  });
  document.getElementById("week-next").addEventListener("click", () => {
    viewedWeekStart = addDaysISO(viewedWeekStart, 7);
    renderSchedule();
  });

  const iconPhoto = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="15" height="11" rx="2"/><circle cx="10" cy="10.5" r="3"/></svg>';

  function renderItems() {
    const grid = document.getElementById("stock-grid");
    const empty = document.getElementById("item-empty");
    const alertBox = document.getElementById("stock-alert");
    document.getElementById("item-count").textContent = `${items.length} 件`;
    grid.innerHTML = "";
    empty.style.display = items.length === 0 ? "block" : "none";

    const sorted = [...items].sort((a, b) => {
      const ea = a.expiryDate || "9999-99-99";
      const eb = b.expiryDate || "9999-99-99";
      return ea < eb ? -1 : ea > eb ? 1 : 0;
    });
    sorted.forEach(item => grid.appendChild(itemCard(item)));

    const expiredCount = items.filter(i => i.expiryDate && itemExpiryStatus(i).kind === "expired").length;
    const soonCount = items.filter(i => i.expiryDate && itemExpiryStatus(i).kind === "soon").length;
    if (expiredCount > 0 || soonCount > 0) {
      const parts = [];
      if (expiredCount > 0) parts.push(`${expiredCount} 件已过期`);
      if (soonCount > 0) parts.push(`${soonCount} 件即将过期`);
      alertBox.textContent = parts.join(" · ");
      alertBox.hidden = false;
    } else {
      alertBox.hidden = true;
    }
  }

  function itemCard(item) {
    const status = itemExpiryStatus(item);
    const card = document.createElement("div");
    card.className = "stock-card" + (status.kind === "expired" ? " expired" : "");

    const top = document.createElement("div");
    top.className = "stock-card-top";

    if (item.photo) {
      const img = document.createElement("img");
      img.className = "stock-thumb";
      img.src = item.photo;
      img.alt = item.name;
      top.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "stock-thumb-placeholder";
      ph.innerHTML = iconPhoto;
      top.appendChild(ph);
    }

    const info = document.createElement("div");
    info.className = "stock-info";
    const name = document.createElement("div");
    name.className = "stock-name";
    name.textContent = item.name;
    const qtyRow = document.createElement("div");
    qtyRow.className = "stock-qty-row";
    const qtyLabel = document.createElement("span");
    qtyLabel.textContent = "数量";
    const qtyInput = document.createElement("input");
    qtyInput.type = "number";
    qtyInput.className = "stock-num-input";
    qtyInput.min = "0";
    qtyInput.step = "1";
    qtyInput.value = item.qty;
    qtyInput.setAttribute("aria-label", `${item.name} 数量`);
    qtyInput.addEventListener("change", () => {
      item.qty = Math.max(0, Number(qtyInput.value) || 0);
      qtyInput.value = item.qty;
      saveItems();
    });
    qtyRow.append(qtyLabel, qtyInput);
    info.append(name, qtyRow);

    const delBtn = document.createElement("button");
    delBtn.className = "icon-btn danger";
    delBtn.innerHTML = iconTrash;
    delBtn.title = "删除";
    delBtn.addEventListener("click", () => {
      items = items.filter(x => x.id !== item.id);
      saveItems();
      renderItems();
    });

    top.append(info, delBtn);

    const badges = document.createElement("div");
    badges.className = "stock-badges";
    const locBadge = document.createElement("span");
    locBadge.className = "badge";
    const locColor = LOCATION_BADGE_COLOR[item.location] || "time";
    locBadge.style.color = `var(--accent-${locColor})`;
    locBadge.style.background = `var(--accent-${locColor}-soft)`;
    locBadge.textContent = item.location;
    const catBadge = document.createElement("span");
    catBadge.className = "badge";
    const catColor = CATEGORY_BADGE_COLOR[item.category] || "purple";
    catBadge.style.color = `var(--accent-${catColor})`;
    catBadge.style.background = `var(--accent-${catColor}-soft)`;
    catBadge.textContent = item.category;
    badges.append(locBadge, catBadge);

    const expiry = document.createElement("div");
    expiry.className = "stock-expiry " + status.kind;
    expiry.textContent = status.text;
    if (item.buyDate) expiry.title = `购买于：${item.buyDate}`;

    card.append(top, badges, expiry);
    return card;
  }

  let pendingPhoto = null;
  const itemPhotoInput = document.getElementById("item-photo-input");
  const itemPhotoPreview = document.getElementById("item-photo-preview");
  itemPhotoInput.addEventListener("change", async () => {
    const file = itemPhotoInput.files[0];
    if (!file) return;
    try {
      pendingPhoto = await resizeImageFile(file);
      itemPhotoPreview.src = pendingPhoto;
      itemPhotoPreview.hidden = false;
    } catch (e) {
      toast("图片处理失败");
    }
  });

  document.getElementById("item-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const nameInput = document.getElementById("item-name");
    const name = nameInput.value.trim();
    if (!name) return;
    const qtyInput = document.getElementById("item-qty");
    const buyInput = document.getElementById("item-buy-date");
    const expiryInput = document.getElementById("item-expiry-date");
    const locationSelect = document.getElementById("item-location");
    const categorySelect = document.getElementById("item-category");

    items.unshift({
      id: uid(),
      name,
      qty: Math.max(0, Number(qtyInput.value) || 0),
      buyDate: buyInput.value || null,
      expiryDate: expiryInput.value || null,
      location: locationSelect.value,
      category: categorySelect.value,
      photo: pendingPhoto,
    });
    saveItems();

    nameInput.value = "";
    qtyInput.value = "1";
    buyInput.value = "";
    expiryInput.value = "";
    itemPhotoInput.value = "";
    itemPhotoPreview.hidden = true;
    pendingPhoto = null;
    renderItems();
  });

  function setActiveTab(tab) {
    document.getElementById("view-tasks").hidden = tab !== "tasks";
    document.getElementById("view-schedule").hidden = tab !== "schedule";
    document.getElementById("view-storage").hidden = tab !== "storage";
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    localStorage.setItem(STORE_TAB, tab);
  }
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => setActiveTab(b.dataset.tab));
  });

  const taskDateInput = document.getElementById("task-date");
  const taskDateText = document.getElementById("task-date-text");
  taskDateInput.addEventListener("input", () => syncDateFieldText(taskDateInput, taskDateText));

  document.getElementById("task-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("task-input");
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: uid(), text, done: false, date: taskDateInput.value || null, ts: Date.now() });
    save(STORE_TASKS, tasks);
    input.value = "";
    taskDateInput.value = "";
    syncDateFieldText(taskDateInput, taskDateText);
    renderTasks();
  });

  const ideaInput = document.getElementById("idea-input");
  ideaInput.addEventListener("input", () => {
    ideaInput.style.height = "auto";
    ideaInput.style.height = Math.min(ideaInput.scrollHeight, 120) + "px";
  });

  document.getElementById("idea-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = ideaInput.value.trim();
    if (!text) return;
    ideas.unshift({ id: uid(), text, ts: Date.now() });
    save(STORE_IDEAS, ideas);
    ideaInput.value = "";
    ideaInput.style.height = "auto";
    renderIdeas();
  });

  document.getElementById("task-done-toggle").addEventListener("click", () => {
    showDone = !showDone;
    renderTasks();
  });

  document.getElementById("idea-copy-all").addEventListener("click", () => {
    if (ideas.length === 0) return toast("没有可复制的内容");
    const text = ideas.map(i => `· ${i.text}`).join("\n");
    copyText(text);
  });

  document.getElementById("habit-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("habit-input");
    const name = input.value.trim();
    if (!name) return;
    habits.push({ id: uid(), name, dates: [] });
    save(STORE_HABITS, habits);
    input.value = "";
    renderHabits();
  });

  document.getElementById("habit-backfill-btn").addEventListener("click", () => {
    const select = document.getElementById("habit-backfill-select");
    const dateField = document.getElementById("habit-backfill-date");
    const h = habits.find(x => x.id === select.value);
    const d = dateField.value;
    if (!h || !d) return;
    if (!h.dates.includes(d)) h.dates = [...h.dates, d];
    save(STORE_HABITS, habits);
    dateField.value = "";
    renderHabits();
    toast(`已补录：${h.name} ${d}`);
  });

  const today = new Date();
  const weekday = ["周日","周一","周二","周三","周四","周五","周六"][today.getDay()];
  document.getElementById("today").textContent =
    `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 ${weekday}`;

  renderTasks();
  renderIdeas();
  renderHabits();
  renderSchedule();
  renderItems();
  setActiveTab(localStorage.getItem(STORE_TAB) || "tasks");
</script>
</body>
</html>
