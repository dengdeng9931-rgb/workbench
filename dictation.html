<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="听写打卡" />
<meta name="theme-color" content="#2f5f86" />
<title>Coach Shane 听写打卡</title>
<style>
  :root {
    --paper: #eef1ec;
    --paper-raised: #ffffff;
    --paper-sunken: #e4e9e1;
    --ink: #1e2a22;
    --ink-soft: #5b6960;
    --ink-faint: #8a978e;
    --line: #d6dcd1;
    --accent: #2f5f86;
    --accent-soft: #dde7ef;
    --danger: #a24d3c;
    --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
    --radius-card: 14px;
    --radius-control: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141813;
      --paper-raised: #1d221e;
      --paper-sunken: #191d17;
      --ink: #e7ece5;
      --ink-soft: #99a69b;
      --ink-faint: #6c766e;
      --line: #2b3129;
      --accent: #6fa8d8;
      --accent-soft: #22323f;
      --danger: #e08b74;
      --danger-soft: #3a2621;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141813; --paper-raised: #1d221e; --paper-sunken: #191d17;
    --ink: #e7ece5; --ink-soft: #99a69b; --ink-faint: #6c766e; --line: #2b3129;
    --accent: #6fa8d8; --accent-soft: #22323f;
    --danger: #e08b74; --danger-soft: #3a2621;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #eef1ec; --paper-raised: #ffffff; --paper-sunken: #e4e9e1;
    --ink: #1e2a22; --ink-soft: #5b6960; --ink-faint: #8a978e; --line: #d6dcd1;
    --accent: #2f5f86; --accent-soft: #dde7ef;
    --danger: #a24d3c; --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 6px 4px 18px; flex-wrap: wrap;
  }
  header.top a.back {
    font-size: 12.5px; color: var(--ink-soft); text-decoration: none;
    display: block; margin-bottom: 6px;
  }
  header.top a.back:hover { color: var(--accent); }
  header.top h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-weight: 600; font-size: 22px; margin: 0;
  }
  header.top .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
  }
  .panel-head .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
    color: var(--accent); background: var(--accent-soft);
  }
  .panel-head h2 { font-size: 15.5px; font-weight: 600; margin: 0; flex: 1; }

  .panel-body { padding: 16px 18px 18px; }

  .ep-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ep-num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 30px; font-weight: 700; color: var(--accent);
    background: none; border: none; padding: 0; cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 5px;
  }
  .ep-total { font-size: 13px; color: var(--ink-soft); }
  .ep-hint { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }

  .go-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14.5px; font-weight: 600; color: #fff;
    background: var(--accent); border: none; border-radius: var(--radius-control);
    padding: 11px 16px; cursor: pointer; text-decoration: none;
    width: 100%; justify-content: center;
  }
  .go-btn:hover { filter: brightness(1.08); }

  .method-note {
    margin-top: 12px; padding: 10px 12px;
    background: var(--paper-sunken); border-radius: 10px;
    font-size: 12.5px; color: var(--ink-soft);
  }

  .rate-row { display: flex; gap: 8px; margin-top: 14px; }
  .rate-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper-sunken); cursor: pointer; font-size: 12px; color: var(--ink-soft);
  }
  .rate-btn:hover { border-color: var(--accent); color: var(--ink); }
  .rate-btn .emo { font-size: 20px; }

  .next-row { margin-top: 12px; }
  .next-btn {
    width: 100%; font-size: 13.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border: none; border-radius: var(--radius-control);
    padding: 9px; cursor: pointer;
  }
  .next-btn:hover { filter: brightness(1.05); }

  .progress-wrap { padding: 16px 18px 18px; }
  .progress-num { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .progress-num b { color: var(--ink); font-size: 15px; }
  .progress-bar { height: 8px; border-radius: 999px; background: var(--paper-sunken); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }

  .hist-list { padding: 6px 18px 16px; display: flex; flex-direction: column; gap: 6px; }
  .hist-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 9px; background: var(--paper-sunken);
    font-size: 13px;
  }
  .hist-row .emo { font-size: 16px; }
  .hist-row .ep { font-weight: 600; font-variant-numeric: tabular-nums; }
  .hist-row .d { margin-left: auto; color: var(--ink-faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .hist-empty { padding: 20px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  .stats-row { display: flex; gap: 10px; padding: 0 18px 16px; }
  .stat-box { flex: 1; text-align: center; padding: 10px; background: var(--paper-sunken); border-radius: 10px; }
  .stat-box .n { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-box .l { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <a class="back" href="index.html">← 返回工作台</a>
      <h1>Coach Shane 听写打卡</h1>
      <div class="sub">Daily English Dictation（B站合集 1-400，共564集）</div>
    </div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <span class="tag">TODAY</span>
      <h2>今天听写第几集</h2>
    </div>
    <div class="panel-body">
      <div class="ep-row">
        <button type="button" class="ep-num" id="ep-num" title="点击可以手动修改集数">第 1 集</button>
        <span class="ep-total">/ 564</span>
      </div>
      <div class="ep-hint">点集数可以手动改（比如想跳过或改回去，不用来找我）</div>
      <a class="go-btn" id="go-btn" href="#" target="_blank" rel="noopener">去B站听写这一集 →</a>
      <div class="method-note">
        不用整集听完——按你自己的节奏，一句大概10分钟，做2-3句完全够。听完对着视频自己核对，跟读到顺，觉得可以了再回来评价。
      </div>
      <div class="rate-row">
        <button type="button" class="rate-btn" data-rate="easy"><span class="emo">😌</span>轻松</button>
        <button type="button" class="rate-btn" data-rate="ok"><span class="emo">🙂</span>还行</button>
        <button type="button" class="rate-btn" data-rate="hard"><span class="emo">😣</span>吃力</button>
      </div>
      <div class="next-row">
        <button type="button" class="next-btn" id="next-btn">完成这集，进入下一集</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="tag">PROGRESS</span>
      <h2>整体进度</h2>
    </div>
    <div class="progress-wrap">
      <div class="progress-num"><span>已完成</span><b id="progress-text">0 / 564</b></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="n" id="stat-total">0</div><div class="l">累计听写次数</div></div>
      <div class="stat-box"><div class="n" id="stat-days">0</div><div class="l">学习过的天数</div></div>
      <div class="stat-box"><div class="n" id="stat-streak">0</div><div class="l">连续天数</div></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="tag">LOG</span>
      <h2>最近记录</h2>
    </div>
    <div class="hist-list" id="hist-list"></div>
    <div class="hist-empty" id="hist-empty">还没有记录，评价完第一集就会出现在这里</div>
  </section>
</div>

<script>
  const STORE = "workbench.dictation.v1";
  const BASE_URL = "https://www.bilibili.com/video/BV1U7411a7xG/?p=";
  const TOTAL_EPISODES = 564;
  const RATE_META = {
    easy: { emo: "😌", label: "轻松" },
    ok: { emo: "🙂", label: "还行" },
    hard: { emo: "😣", label: "吃力" },
  };

  function toISO(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function todayISO() { return toISO(new Date()); }
  function daysBetween(fromISO, toISOStr) {
    const [fy, fm, fd] = fromISO.split("-").map(Number);
    const [ty, tm, td] = toISOStr.split("-").map(Number);
    return Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* fall through */ }
    return { currentEpisode: 1, history: [] }; // history: [{episode, rate, date}], newest last
  }
  function save() { localStorage.setItem(STORE, JSON.stringify(data)); }

  let data = load();
  if (!Array.isArray(data.history)) data.history = [];

  function toast(msg) {
    let el = document.getElementById("toast-el");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast-el";
      el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = "0"; }, 1600);
  }

  function render() {
    const ep = data.currentEpisode;
    document.getElementById("ep-num").textContent = `第 ${ep} 集`;
    document.getElementById("go-btn").href = BASE_URL + ep;

    // progress: 完成数 = 历史记录里出现过的不同集数个数
    const doneSet = new Set(data.history.map(h => h.episode));
    const doneCount = doneSet.size;
    document.getElementById("progress-text").textContent = `${doneCount} / ${TOTAL_EPISODES}`;
    document.getElementById("progress-fill").style.width = `${Math.min(100, (doneCount / TOTAL_EPISODES) * 100)}%`;

    document.getElementById("stat-total").textContent = data.history.length;
    const dayset = new Set(data.history.map(h => h.date));
    document.getElementById("stat-days").textContent = dayset.size;

    // 连续天数：从今天往前数，只要有记录就+1，中断就停
    let streak = 0;
    let cursor = todayISO();
    while (dayset.has(cursor)) {
      streak += 1;
      cursor = toISO(new Date(new Date(cursor).getTime() - 86400000));
    }
    document.getElementById("stat-streak").textContent = streak;

    // history list（最近10条，倒序）
    const list = document.getElementById("hist-list");
    const empty = document.getElementById("hist-empty");
    const recent = data.history.slice(-10).reverse();
    empty.style.display = recent.length ? "none" : "block";
    list.innerHTML = "";
    recent.forEach(h => {
      const row = document.createElement("div");
      row.className = "hist-row";
      const meta = RATE_META[h.rate] || { emo: "✅", label: "" };
      row.innerHTML = `<span class="emo">${meta.emo}</span><span class="ep">第${h.episode}集</span><span class="d">${h.date}</span>`;
      list.appendChild(row);
    });
  }

  document.getElementById("ep-num").addEventListener("click", () => {
    const input = prompt(`设置当前在第几集（1-${TOTAL_EPISODES}）：`, String(data.currentEpisode));
    if (input === null) return;
    const n = parseInt(input, 10);
    if (!Number.isFinite(n) || n < 1 || n > TOTAL_EPISODES) { toast("请输入 1-564 之间的数字"); return; }
    data.currentEpisode = n;
    save();
    render();
    toast(`已设为第 ${n} 集`);
  });

  document.querySelectorAll(".rate-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      data.history.push({ episode: data.currentEpisode, rate: btn.dataset.rate, date: todayISO() });
      save();
      render();
      toast("已记录，加油");
    });
  });

  document.getElementById("next-btn").addEventListener("click", () => {
    data.currentEpisode = Math.min(TOTAL_EPISODES, data.currentEpisode + 1);
    save();
    render();
    toast(`进入第 ${data.currentEpisode} 集`);
  });

  render();
</script>
</body>
</html>
