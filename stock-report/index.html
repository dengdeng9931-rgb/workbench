<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Report">
<meta name="theme-color" content="#2E6F64">
<style>
  :root {
    --bg: #E9ECE8;
    --sheet: #FCFDFB;
    --row: #F3F5F1;
    --row-checked: #E4EEE9;
    --ink: #1C2420;
    --ink-muted: #626B62;
    --border: #D4D9D0;
    --accent: #2E6F64;
    --accent-ink: #FFFFFF;
    --warn: #B4720F;
    --warn-bg: #F6E7CE;
    --critical: #A83A34;
    --critical-bg: #F5DEDA;
    --focus-ring: #2E6F64;

    --font-display: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    --font-body: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "SFMono-Regular", ui-monospace, "Menlo", "Consolas", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121613;
      --sheet: #1A1F1B;
      --row: #212722;
      --row-checked: #223531;
      --ink: #E8EBE5;
      --ink-muted: #8B9389;
      --border: #2B3129;
      --accent: #63C2AD;
      --accent-ink: #0B1512;
      --warn: #E2AC58;
      --warn-bg: #3B2E17;
      --critical: #E38077;
      --critical-bg: #3E211E;
      --focus-ring: #63C2AD;
    }
  }
  :root[data-theme="dark"] #reportDate { color-scheme: dark; }
  :root[data-theme="light"] #reportDate { color-scheme: light; }
  :root[data-theme="dark"] {
    --bg: #121613;
    --sheet: #1A1F1B;
    --row: #212722;
    --row-checked: #223531;
    --ink: #E8EBE5;
    --ink-muted: #8B9389;
    --border: #2B3129;
    --accent: #63C2AD;
    --accent-ink: #0B1512;
    --warn: #E2AC58;
    --warn-bg: #3B2E17;
    --critical: #E38077;
    --critical-bg: #3E211E;
    --focus-ring: #63C2AD;
  }
  :root[data-theme="light"] {
    --bg: #E9ECE8;
    --sheet: #FCFDFB;
    --row: #F3F5F1;
    --row-checked: #E4EEE9;
    --ink: #1C2420;
    --ink-muted: #626B62;
    --border: #D4D9D0;
    --accent: #2E6F64;
    --accent-ink: #FFFFFF;
    --warn: #B4720F;
    --warn-bg: #F6E7CE;
    --critical: #A83A34;
    --critical-bg: #F5DEDA;
    --focus-ring: #2E6F64;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 20px 12px 48px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .page {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .sheet {
    background: var(--sheet);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .eyebrow {
    font-family: var(--font-display);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  /* ---- Letterhead ---- */
  .letterhead {
    padding: 18px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .letterhead-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: -0.01em;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    text-wrap: balance;
  }
  .letterhead-title span.static { color: var(--ink-muted); font-weight: 500; }
  .field-input {
    font-family: inherit;
    font-weight: 700;
    font-size: inherit;
    color: var(--ink);
    background: var(--row);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px 8px;
  }
  #location { color: var(--ink); font-weight: 700; }
  #reportDate {
    font-family: inherit;
    font-weight: 700;
    font-size: inherit;
    color: var(--ink);
    background: var(--row);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px 8px;
    color-scheme: light dark;
  }
  input:focus-visible, button:focus-visible, .field-input:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 1px;
  }

  /* ---- Search ---- */
  .search-bar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--sheet);
  }
  .search-bar input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.88rem;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--row);
    color: var(--ink);
  }
  .search-bar input::placeholder { color: var(--ink-muted); }

  /* ---- Checklist ---- */
  .checklist {
    display: flex;
    flex-direction: column;
  }
  .category-group {
    display: flex;
    flex-direction: column;
  }
  .category-header {
    padding: 12px 14px 5px;
    background: var(--sheet);
  }
  .category-header .eyebrow { color: var(--accent); }
  .item-row {
    display: grid;
    grid-template-columns: 22px 1fr 46px 58px 22px;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--row);
    transition: background-color 0.15s ease, opacity 0.15s ease;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row.is-checked { background: var(--row-checked); }
  .item-row.is-unchecked { opacity: 0.62; }

  .chk {
    width: 19px;
    height: 19px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .item-name-wrap {
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 2px;
  }
  .item-name {
    font-family: var(--font-body);
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    padding: 2px 0;
    min-width: 0;
    width: 100%;
  }
  .item-name:focus { outline: none; border-bottom: 1px dashed var(--accent); }
  .status-chip {
    font-family: var(--font-display);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 999px;
    width: fit-content;
    display: none;
  }
  .status-chip.show-critical {
    display: inline-block;
    background: var(--critical-bg);
    color: var(--critical);
  }
  .status-chip.show-warn {
    display: inline-block;
    background: var(--warn-bg);
    color: var(--warn);
  }

  .qty-input {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    text-align: center;
    width: 100%;
    padding: 5px 2px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--sheet);
    color: var(--ink);
  }
  .qty-input.needs-qty { border-color: var(--critical); border-style: dashed; }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-input[type="number"] { -moz-appearance: textfield; }

  .unit-input {
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-muted);
    width: 100%;
    padding: 5px 4px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--sheet);
  }
  .unit-input::placeholder { color: var(--ink-muted); opacity: 0.7; }

  .remove-btn {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .remove-btn:hover { background: var(--critical-bg); color: var(--critical); }

  /* ---- Add item ---- */
  .add-row {
    display: grid;
    grid-template-columns: 1fr 72px auto;
    gap: 8px;
    padding: 12px 14px;
    background: var(--sheet);
  }
  .add-row input {
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--row);
    color: var(--ink);
    min-width: 0;
  }
  .add-btn {
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--row-checked); }

  /* ---- Output panel ---- */
  .output-panel {
    background: var(--sheet);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .output-actions { display: flex; gap: 8px; }
  .ghost-btn, .primary-btn {
    font-family: var(--font-display);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .ghost-btn {
    background: transparent;
    border-color: var(--border);
    color: var(--ink-muted);
  }
  .ghost-btn:hover { color: var(--ink); border-color: var(--ink-muted); }
  .primary-btn {
    background: var(--accent);
    color: var(--accent-ink);
    transition: background-color 0.15s ease;
  }
  .primary-btn:hover { filter: brightness(1.05); }
  .primary-btn:disabled {
    background: var(--border);
    color: var(--ink-muted);
    cursor: not-allowed;
  }
  .primary-btn.copied { background: var(--accent); }

  .output-text {
    margin: 0;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.86rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--ink);
    background: var(--row);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 64px;
    max-height: 320px;
    overflow-y: auto;
  }
  .output-text.placeholder {
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-style: italic;
  }

  .footnote {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-muted);
  }
</style>
</head>
<body>

<div class="page">
  <div class="sheet">
    <div class="letterhead">
      <div class="eyebrow">Stock Report</div>
      <div class="letterhead-title">
        <span class="static">stock at</span>
        <span id="location">B3</span>
        <span class="static">on</span>
        <input id="reportDate" type="date" aria-label="Report date">
      </div>
    </div>

    <div class="search-bar">
      <input id="filterInput" type="text" placeholder="Search items…" aria-label="Search items">
    </div>

    <div class="checklist" id="checklist"></div>

    <div class="add-row">
      <input id="newItemName" placeholder="New item name" maxlength="40">
      <input id="newItemUnit" placeholder="unit">
      <button class="add-btn" id="addItemBtn">+ Add</button>
    </div>
  </div>

  <div class="output-panel">
    <div class="output-header">
      <span class="eyebrow">Preview</span>
      <div class="output-actions">
        <button class="ghost-btn" id="clearBtn">Clear counts</button>
        <button class="primary-btn" id="copyBtn" disabled>Copy</button>
      </div>
    </div>
    <pre class="output-text placeholder" id="outputText">Tick the items that need restocking and enter a quantity — the report builds itself here.</pre>
  </div>

  <div class="footnote">Item list is saved on this device only.</div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'stockReportItems_v2';

  var seedCategories = [
    { category: 'Juices', items: [
      { name: 'OJ', unit: '' },
      { name: 'GUA', unit: '' },
      { name: 'AP', unit: '' },
      { name: 'MJ', unit: '' },
      { name: 'ABC', unit: '' },
      { name: 'Apple (Large)', unit: '' },
      { name: 'Orange (Large)', unit: '' },
      { name: 'Cranberry (Large)', unit: '' },
      { name: 'Guava (Large)', unit: '' }
    ]},
    { category: 'Yogurts', items: [
      { name: 'Plain', unit: '' },
      { name: 'Strawberry', unit: '' },
      { name: 'Blueberry', unit: '' },
      { name: 'Passionfruit', unit: '' }
    ]},
    { category: 'Milk', items: [
      { name: 'Full cream', unit: '' },
      { name: 'Skim Milk', unit: '' },
      { name: 'Soy Milk', unit: '' },
      { name: 'Almond Milk', unit: '' },
      { name: 'Oat Milk', unit: 'bottles' },
      { name: 'Lactose Free Milk', unit: '' }
    ]},
    { category: 'Whole fruits', items: [
      { name: 'Banana', unit: '' },
      { name: 'Pear', unit: '' },
      { name: 'Mandarin', unit: '' },
      { name: 'Green Apple', unit: '' },
      { name: 'Red Apple', unit: '' }
    ]},
    { category: 'Citrus fruits', items: [
      { name: 'Lime', unit: '' },
      { name: 'Lemon', unit: '' }
    ]},
    { category: 'Cereals', items: [
      { name: 'Cornflakes', unit: '' },
      { name: 'Nutrigrain', unit: '' },
      { name: 'Puffed rice', unit: '' },
      { name: 'Toasted muesli', unit: '' },
      { name: 'Wild berry granola', unit: '' },
      { name: 'CoCo Puff', unit: '' }
    ]},
    { category: 'Condiments', items: [
      { name: 'Ketchup', unit: '' },
      { name: 'Ketchup squizzie', unit: '' },
      { name: 'BBQ', unit: '' },
      { name: 'BBQ squizzie', unit: '' },
      { name: 'Sriracha', unit: '' },
      { name: 'Tabasco Red', unit: 'bottles' },
      { name: 'Tabasco Green', unit: 'bottles' },
      { name: 'American Mustard', unit: '' },
      { name: 'HP sauce', unit: '' },
      { name: 'Worchester', unit: '' },
      { name: 'Olive oil', unit: '' },
      { name: 'Balsamic Vinegar', unit: '' },
      { name: 'Soy sauce', unit: '' },
      { name: 'Iodized Salt (table salt)', unit: '' },
      { name: 'Sweet chilli sauce', unit: '' },
      { name: 'Raw sugar', unit: '' },
      { name: 'White sugar', unit: '' },
      { name: 'Equals (sweetener)', unit: '' }
    ]},
    { category: 'Dried Fruits/nuts', items: [
      { name: 'Dried Apricot', unit: '' },
      { name: 'Dried Cranberry', unit: '' },
      { name: 'Walnut', unit: '' },
      { name: 'Sunflower seeds', unit: '' },
      { name: 'Pumpkin seeds', unit: '' },
      { name: 'Pistachio', unit: '' },
      { name: 'Salted Mixed Nuts', unit: '' }
    ]},
    { category: 'Coffee/Cocoa', items: [
      { name: 'Coffee Bean', unit: '' },
      { name: 'Douwe Egberts liquid coffee', unit: '' },
      { name: 'Cocoa Powder (Cacao Fantasy Blue)', unit: '' }
    ]},
    { category: 'Tea', items: [
      { name: 'English BF', unit: '' },
      { name: 'Earl Grey', unit: '' },
      { name: 'Peppermint', unit: '' },
      { name: 'Green tea', unit: '' },
      { name: 'Spice Chai', unit: '' },
      { name: 'Chamomile', unit: '' }
    ]},
    { category: 'Butter/Jam', items: [
      { name: 'Butter', unit: '' },
      { name: 'Margarine', unit: '' },
      { name: 'Peanut butter', unit: '' },
      { name: 'Vegemite', unit: '' },
      { name: 'Strawberry jam', unit: '' },
      { name: 'Raspberry jam', unit: '' },
      { name: 'Apricot jam', unit: '' },
      { name: 'Orange marmalade', unit: '' },
      { name: 'Honey', unit: '' }
    ]},
    { category: 'Salad dressing', items: [
      { name: 'Coriander, ginger & lime dressing', unit: '' },
      { name: 'Greek lemon dressing', unit: '' }
    ]},
    { category: 'Crackers', items: [
      { name: 'Cheeseboard cracker', unit: '' },
      { name: 'Grissini Stick', unit: '' },
      { name: 'Gluten Free rice cracker', unit: '' }
    ]}
  ];

  function seedFlat() {
    var flat = [];
    var ci = 0;
    seedCategories.forEach(function (group) {
      group.items.forEach(function (it, ii) {
        flat.push({ id: 'c' + ci + 'i' + ii, name: it.name, unit: it.unit, category: group.category });
      });
      ci++;
    });
    return flat;
  }

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) {
          return parsed.map(function (it) { return { id: it.id, name: it.name, unit: it.unit || '', category: it.category || 'Other' }; });
        }
      }
    } catch (e) {}
    return seedFlat();
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items.map(function (it) {
      return { id: it.id, name: it.name, unit: it.unit, category: it.category };
    })));
  }

  var items = loadItems();
  var idCounter = items.length;

  var state = {}; // id -> { checked: bool, qty: string }
  items.forEach(function (it) { state[it.id] = { checked: false, qty: '' }; });

  var checklistEl = document.getElementById('checklist');
  var outputEl = document.getElementById('outputText');
  var copyBtn = document.getElementById('copyBtn');
  var clearBtn = document.getElementById('clearBtn');
  var dateInput = document.getElementById('reportDate');

  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function formatDate(isoStr) {
    var parts = isoStr.split('-');
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    return ordinal(d) + ' ' + MONTHS[m - 1];
  }

  function todayIso() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  dateInput.value = todayIso();

  dateInput.addEventListener('change', updateOutput);

  function renderRow(item) {
    var row = document.createElement('div');
    row.className = 'item-row is-unchecked';
    row.dataset.id = item.id;

    var chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.className = 'chk';
    chk.setAttribute('aria-label', 'Include ' + item.name);

    var nameWrap = document.createElement('div');
    nameWrap.className = 'item-name-wrap';

    var nameInput = document.createElement('input');
    nameInput.className = 'item-name';
    nameInput.value = item.name;
    nameInput.setAttribute('aria-label', 'Item name');

    var chip = document.createElement('span');
    chip.className = 'status-chip';
    chip.textContent = 'OUT';

    nameWrap.appendChild(nameInput);
    nameWrap.appendChild(chip);

    var qtyInput = document.createElement('input');
    qtyInput.type = 'number';
    qtyInput.min = '0';
    qtyInput.inputMode = 'numeric';
    qtyInput.className = 'qty-input';
    qtyInput.placeholder = '0';
    qtyInput.setAttribute('aria-label', 'Quantity for ' + item.name);

    var unitInput = document.createElement('input');
    unitInput.type = 'text';
    unitInput.className = 'unit-input';
    unitInput.placeholder = 'unit';
    unitInput.value = item.unit || '';
    unitInput.setAttribute('aria-label', 'Unit for ' + item.name);

    var removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '&times;';
    removeBtn.title = 'Remove item';
    removeBtn.setAttribute('aria-label', 'Remove ' + item.name);

    row.appendChild(chk);
    row.appendChild(nameWrap);
    row.appendChild(qtyInput);
    row.appendChild(unitInput);
    row.appendChild(removeBtn);

    function refreshRowVisual() {
      var st = state[item.id];
      row.classList.toggle('is-checked', st.checked);
      row.classList.toggle('is-unchecked', !st.checked);
      qtyInput.classList.toggle('needs-qty', st.checked && st.qty === '');
      chip.classList.remove('show-critical', 'show-warn');
      if (st.checked && st.qty !== '') {
        var n = parseInt(st.qty, 10);
        if (!isNaN(n)) {
          if (n === 0) { chip.textContent = 'OUT'; chip.classList.add('show-critical'); }
          else { chip.textContent = 'LOW'; chip.classList.add('show-warn'); }
        }
      }
    }

    chk.addEventListener('change', function () {
      state[item.id].checked = chk.checked;
      if (chk.checked && qtyInput.value === '') { qtyInput.focus(); }
      refreshRowVisual();
      updateOutput();
    });
    qtyInput.addEventListener('input', function () {
      state[item.id].qty = qtyInput.value;
      refreshRowVisual();
      updateOutput();
    });
    nameInput.addEventListener('input', function () {
      item.name = nameInput.value;
      saveItems();
      refreshRowVisual();
      updateOutput();
    });
    unitInput.addEventListener('input', function () {
      item.unit = unitInput.value;
      saveItems();
      updateOutput();
    });
    removeBtn.addEventListener('click', function () {
      items = items.filter(function (it) { return it.id !== item.id; });
      delete state[item.id];
      saveItems();
      renderAll();
      updateOutput();
    });

    refreshRowVisual();
    return row;
  }

  function renderAll() {
    checklistEl.innerHTML = '';
    var order = [];
    items.forEach(function (item) {
      if (order.indexOf(item.category) === -1) order.push(item.category);
    });
    order.forEach(function (category) {
      var group = document.createElement('div');
      group.className = 'category-group';
      group.dataset.category = category;

      var header = document.createElement('div');
      header.className = 'category-header';
      var label = document.createElement('span');
      label.className = 'eyebrow';
      label.textContent = category;
      header.appendChild(label);
      group.appendChild(header);

      items.filter(function (it) { return it.category === category; }).forEach(function (item) {
        group.appendChild(renderRow(item));
      });

      checklistEl.appendChild(group);
    });
    applyFilter();
  }

  function applyFilter() {
    var q = document.getElementById('filterInput').value.trim().toLowerCase();
    checklistEl.querySelectorAll('.category-group').forEach(function (group) {
      var anyVisible = false;
      group.querySelectorAll('.item-row').forEach(function (row) {
        var nameInput = row.querySelector('.item-name');
        var match = !q || nameInput.value.toLowerCase().indexOf(q) !== -1;
        row.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
      });
      group.style.display = anyVisible ? '' : 'none';
    });
  }

  function updateOutput() {
    var location = 'B3';
    var dateText = formatDate(dateInput.value);
    var noStock = [];
    var lowStock = [];

    items.forEach(function (item) {
      var st = state[item.id];
      if (!st.checked || st.qty === '') return;
      var n = parseInt(st.qty, 10);
      if (isNaN(n) || n < 0) return;
      if (n === 0) noStock.push({ name: item.name });
      else lowStock.push({ name: item.name, qty: n, unit: item.unit });
    });

    if (noStock.length === 0 && lowStock.length === 0) {
      outputEl.textContent = 'Tick the items that need restocking and enter a quantity — the report builds itself here.';
      outputEl.classList.add('placeholder');
      copyBtn.disabled = true;
      return;
    }

    var lines = [];
    lines.push('stock at ' + location + ' on ' + dateText);
    lines.push('');
    if (noStock.length) {
      lines.push(' · No stock');
      noStock.forEach(function (i) { lines.push(i.name + ' 0'); });
      lines.push('');
    }
    if (lowStock.length) {
      lines.push(' · Low stock');
      lowStock.forEach(function (i) { lines.push(i.name + ' ' + i.qty + (i.unit ? ' ' + i.unit : '')); });
    }

    while (lines.length && lines[lines.length - 1] === '') lines.pop();

    outputEl.textContent = lines.join('\n');
    outputEl.classList.remove('placeholder');
    copyBtn.disabled = false;
  }

  document.getElementById('addItemBtn').addEventListener('click', function () {
    var nameField = document.getElementById('newItemName');
    var unitField = document.getElementById('newItemUnit');
    var name = nameField.value.trim();
    if (!name) { nameField.focus(); return; }
    var id = 'item' + (idCounter++);
    items.push({ id: id, name: name, unit: unitField.value.trim(), category: 'Other' });
    state[id] = { checked: false, qty: '' };
    saveItems();
    renderAll();
    updateOutput();
    nameField.value = '';
    unitField.value = '';
    nameField.focus();
  });

  document.getElementById('filterInput').addEventListener('input', applyFilter);

  document.getElementById('newItemName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addItemBtn').click(); }
  });
  document.getElementById('newItemUnit').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addItemBtn').click(); }
  });

  clearBtn.addEventListener('click', function () {
    items.forEach(function (item) { state[item.id] = { checked: false, qty: '' }; });
    renderAll();
    updateOutput();
  });

  copyBtn.addEventListener('click', function () {
    var text = outputEl.textContent;
    function showCopied() {
      var original = copyBtn.textContent;
      copyBtn.textContent = 'Copied';
      copyBtn.classList.add('copied');
      setTimeout(function () { copyBtn.textContent = original; copyBtn.classList.remove('copied'); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, function () { fallbackCopy(text, showCopied); });
    } else {
      fallbackCopy(text, showCopied);
    }
  });

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }

  renderAll();
  updateOutput();
})();
</script>
</body>
</html>
