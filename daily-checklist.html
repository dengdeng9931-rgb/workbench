<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Daily Checklist" />
<meta name="theme-color" content="#2f5f86" />
<title>Daily Checklist</title>
<style>
  :root {
    --paper: #eef1ec;
    --paper-raised: #ffffff;
    --paper-sunken: #e4e9e1;
    --ink: #1e2a22;
    --ink-soft: #5b6960;
    --ink-faint: #8a978e;
    --line: #d6dcd1;
    --accent: #2f5f86;
    --accent-soft: #dde7ef;
    --done: #2f7a4f;
    --done-soft: #dcece1;
    --danger: #a24d3c;
    --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
    --radius-card: 14px;
    --radius-control: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141813;
      --paper-raised: #1d221e;
      --paper-sunken: #191d17;
      --ink: #e7ece5;
      --ink-soft: #99a69b;
      --ink-faint: #6c766e;
      --line: #2b3129;
      --accent: #6fa8d8;
      --accent-soft: #22323f;
      --done: #6fcf97;
      --done-soft: #1f3327;
      --danger: #e08b74;
      --danger-soft: #3a2621;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141813; --paper-raised: #1d221e; --paper-sunken: #191d17;
    --ink: #e7ece5; --ink-soft: #99a69b; --ink-faint: #6c766e; --line: #2b3129;
    --accent: #6fa8d8; --accent-soft: #22323f;
    --done: #6fcf97; --done-soft: #1f3327;
    --danger: #e08b74; --danger-soft: #3a2621;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme="light"] {
    --paper: #eef1ec; --paper-raised: #ffffff; --paper-sunken: #e4e9e1;
    --ink: #1e2a22; --ink-soft: #5b6960; --ink-faint: #8a978e; --line: #d6dcd1;
    --accent: #2f5f86; --accent-soft: #dde7ef;
    --done: #2f7a4f; --done-soft: #dcece1;
    --danger: #a24d3c; --danger-soft: #f3e3de;
    --shadow: 0 1px 2px rgba(30, 42, 34, 0.06), 0 6px 16px -8px rgba(30, 42, 34, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 6px 4px 18px; flex-wrap: wrap;
  }
  header.top a.back {
    font-size: 12.5px; color: var(--ink-soft); text-decoration: none;
    display: block; margin-bottom: 6px;
  }
  header.top a.back:hover { color: var(--accent); }
  header.top h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-weight: 600; font-size: 22px; margin: 0;
  }
  header.top .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }

  .reset-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-soft); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--ink-soft);
  }
  .reset-bar b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .reset-now-btn {
    font-size: 12px; color: var(--accent); background: none;
    border: 1px solid var(--accent); border-radius: 7px;
    padding: 5px 9px; cursor: pointer; flex-shrink: 0;
  }
  .reset-now-btn:hover { background: var(--accent); color: #fff; }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--line);
    cursor: pointer; list-style: none;
  }
  .panel-head::-webkit-details-marker { display: none; }
  .panel-head::before {
    content: "▾"; font-size: 10px; color: var(--ink-faint); flex-shrink: 0;
  }
  .panel:not([open]) .panel-head::before { content: "▸"; }
  .panel:not([open]) .panel-head { border-bottom: none; }
  .panel-head .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 5px;
    color: var(--accent); background: var(--accent-soft);
  }
  .panel-head h2 { font-size: 15.5px; font-weight: 600; margin: 0; flex: 1; }
  .count-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft);
  }

  .check-list { padding: 8px 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  .check-group-label {
    font-size: 12px; color: var(--ink-soft); font-weight: 600;
    margin: 10px 10px 2px;
  }
  .check-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 10px 10px; border-radius: 10px; cursor: pointer;
    user-select: none;
  }
  .check-row:hover { background: var(--paper-sunken); }
  .check-item.sub { margin-left: 20px; }
  .check-row .mark {
    width: 18px; height: 18px; flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
  }
  .check-row.done .mark {
    border-color: var(--done);
    background: var(--done);
  }
  .check-row .mark svg { width: 11px; height: 11px; display: block; }
  .check-row .txt { font-size: 14px; flex: 1 1 auto; min-width: 100px; }
  .check-row.done { background: var(--done-soft); }
  .check-row.done:hover { background: var(--done-soft); filter: brightness(0.97); }
  .check-row.done .txt { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .check-row .thumb {
    height: 30px; width: auto; max-width: 46px; flex-shrink: 0;
    border-radius: 5px; border: 1px solid var(--line);
    cursor: zoom-in; object-fit: cover; display: block;
  }
  .check-row .thumb:hover { border-color: var(--accent); }

  .lightbox {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(10, 14, 11, 0.86);
    display: flex; align-items: center; justify-content: center;
    padding: 28px; cursor: zoom-out;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: var(--shadow); }

  .footer-note {
    font-size: 12px; color: var(--ink-faint); text-align: center;
    padding: 8px 18px 0; line-height: 1.6;
  }

  .lookup-block {
    border-top: 1px solid var(--line);
    padding: 4px 18px 14px;
  }
  .lookup-block summary {
    cursor: pointer; padding: 12px 4px;
    font-size: 13.5px; font-weight: 600; color: var(--accent);
    list-style: none;
  }
  .lookup-block summary::-webkit-details-marker { display: none; }
  .lookup-block summary::before { content: "▸ "; }
  .lookup-block[open] summary::before { content: "▾ "; }
  .lookup-body { padding: 2px 4px 0; }
  .lookup-search {
    width: 100%; font: inherit; font-size: 14px;
    padding: 9px 11px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: var(--radius-control);
    background: var(--paper-sunken); color: var(--ink);
  }
  .lookup-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lookup-cat {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink-soft); margin: 12px 2px 4px;
  }
  .lookup-cat:first-child { margin-top: 2px; }
  .lookup-row {
    display: flex; flex-direction: column; gap: 1px;
    padding: 7px 8px; border-radius: 8px; font-size: 13px;
  }
  .lookup-row:nth-child(odd) { background: var(--paper-sunken); }
  .lookup-row .par { color: var(--ink-soft); font-size: 11.5px; }
  .lookup-row .full { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .lookup-row.warn .full { color: var(--danger); }
  .lookup-empty { padding: 14px 8px; text-align: center; color: var(--ink-faint); font-size: 13px; }
  .lookup-note {
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.6;
    margin: 12px 2px 0; padding-top: 10px; border-top: 1px dashed var(--line);
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <a class="back" href="index.html">← 返回工作台</a>
      <h1>Daily Checklist</h1>
      <div class="sub">Executive Lounge · 2-5工作 + report工作 + 日常检查</div>
    </div>
  </header>

  <div class="reset-bar">
    <span>每天下午1点自动清空重来，下次重置：<b id="next-reset">—</b></span>
    <button type="button" class="reset-now-btn" id="reset-now-btn">立即重置</button>
  </div>

  <details class="panel" id="pm-details">
    <summary class="panel-head">
      <span class="tag">2-5PM</span>
      <h2>2-5 工作</h2>
      <span class="count-chip" id="pm-count">0 / 0</span>
    </summary>
    <div class="check-list" id="pm-list"></div>
  </details>

  <details class="panel" id="rp-details">
    <summary class="panel-head">
      <span class="tag">REPORT</span>
      <h2>report 工作</h2>
      <span class="count-chip" id="rp-count">0 / 0</span>
    </summary>
    <div class="check-list" id="rp-list"></div>
    <details class="lookup-block">
      <summary>📋 系统全名对照表（订货登记时查这个）</summary>
      <div class="lookup-body">
        <input type="search" id="lookup-search" class="lookup-search" placeholder="搜索品名，比如 vodka 或 pepsi…" />
        <div id="lookup-results"></div>
        <p class="lookup-note">Tequila Gold 在系统里对应品牌是 <b>Olmeca Gold</b>，搜索时注意关键词。周四夜单和周日夜单，订购量需 ×2.5。最后更新 2026-09-17，改了原表要记得告诉我同步。</p>
      </div>
    </details>
  </details>

  <details class="panel" id="rc-details">
    <summary class="panel-head">
      <span class="tag">FLOOR</span>
      <h2>日常检查</h2>
      <span class="count-chip" id="rc-count">0 / 0</span>
    </summary>
    <div class="check-list" id="rc-list"></div>
  </details>

  <p class="footer-note">勾选只存在这台设备的浏览器里，换设备/清缓存不会同步。</p>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  const STORE = "workbench.dailychecklist.v1";

  const PM_ITEMS = [

  const REPORT_ITEMS = [

    { id: "rp2", text: "Special Pre Arrival report 加明天的Amenity" },
    { id: "rp3", text: "GB/AV tmr Opera和GXP上更新" },
    { id: "rp4", text: "检查未来3天的X5 amenity" },
    { id: "rp5", text: "录入powwow并在群里更新", images: ["checklist-img/powwow.png"] },
    { id: "rp6", text: "关amenity发群里", images: ["checklist-img/amenity-count.png"] },
    { id: "rp6a", text: "early amenities", indent: true },
    { id: "rp6b", text: "提前核对特殊要求", indent: true },
    { id: "rp7", text: "邮件和chef群里发预测报表（附件+文件名要对）", images: ["checklist-img/forecast-1.jpg", "checklist-img/kitchen-forecast.png", "checklist-img/forecast-3.jpg"] },
    { id: "rp8", text: "盘点库存并订货（五六除外）", images: ["checklist-img/stock-1.jpg", "checklist-img/stock-2.png", "checklist-img/stock-3.jpg", "checklist-img/stock-4.jpg"] },
    { id: "rp8a", text: "Misc看情况决定", indent: true },
    { id: "rp9", text: "LST 14+ night for T+5days 发入住前邮件，更新文档", images: ["checklist-img/pre-arrival-email.jpg"] },
  ];

  const RC_ITEMS = [
    { id: "rc1", text: "补饮料／糖／茶／咖啡豆／纸杯／餐巾纸/抽屉" },
    { id: "rc2", text: "擦拭摆放所有空桌／盐胡椒摆放" },
    { id: "rc3", text: "咖啡/茶水台 水渍清理" },
    { id: "rc4", text: "入门口/清洁台清理" },
    { id: "rc5", text: "Top up sanitizer bottles." },
    { id: "rc6", text: "double check hot box and heater off" },
    { id: "rc7", text: "锁上所有柜子" },
    { id: "rc8", text: "Take all keys and return them at Level B2" },
  ];

  // Par表品名 → 系统里下单要用的 Product Desc 全名，来自 Exec-Lounge-订购产品对照表.md（2026-09-17）
  const PRODUCT_LOOKUP = [
    { cat: "软饮 Soft Drinks", rows: [
      ["Bitter Lemon", "Softdrink/Bitter Lemon/300ML/BTL"],
      ["Ginger Ale", "Softdrink/Ginger Ale/300ML/BTL"],
      ["Pepsi Max", "Softdrink/Pepsi Max/300ML/BTL"],
      ["Pepsi Cola", "Softdrink/Pepsi/300ML/BTL"],
      ["Lemonade", "Softdrink/Schweppes Lemonade/300ML/BTL"],
      ["Tonic Water", "Softdrink/Tonic Water/300ML/BTL"],
      ["Sodawater", "Softdrink/Soda Water/300ML/BTL"],
      ["Lime Cordial（Par表归在Other）", "Softdrink/Schweppes Lime Cordial/750ML x 12/CASE"],
    ]},
    { cat: "水 Water", rows: [
      ["Still Water 500ml", "Water/Still/Santa Vittoria/500ML/BTL"],
      ["Still Water 1000ml", "Water/Still/Santa Vittoria/1LTL/BTL"],
      ["Sparkling Water 500ml", "Water/Spark/Santa Vittoria/500ML/BTL"],
      ["Sparkling Water 1000ml", "Water/Spark/Santa Vittoria/1LT/BTL"],
    ]},
    { cat: "啤酒 Beer", rows: [
      ["Stone & Wood Pacific Ale", "Beer/Domestic/Stone&Wood Pacific Ale/Ctn24/330ml/BTL"],
      ["Little Creatures Pale Ale", "Beer/Domestic/Little Creatures Pale Ale/Ctn24/330ml/BTL"],
      ["Kirin Ichiban", "Beer/Imported/Kirin Ichiban/Ctn24/330ml/BTL"],
      ["James Boag Light", "Beer/Domestic/James Boags Premium Light/Ctn24/375ml/BTL"],
      ["Hahn Super Dry", "Beer/Domestic/Hahn Super/Ctn24/330ml/BTL"],
      ["CHB", "Beer/Domestic/CHB Lager/375ML/CAN"],
    ]},
    { cat: "葡萄酒 Wine", rows: [
      ["Shiraz", "ZZZ/Wine/Red/Chain of Fire Shiraz Cab/750ML/BTL2"],
      ["Pinot Noir", "ZZZ/Wine/Red/Chain of Fire Pinot Noir/750ML/BTL2"],
      ["Chardonnay", "ZZZ/Wine/White/Chain of Fire Chardonnay/750ML/BTL"],
      ["Sauv Blan Semillon", "ZZZ/Wine/White/Chain of Fire Sauv Blan Semillon/750ML/BTL"],
      ["Brut Cuvee", "ZZZ/Wine/Sparkling/Chain of Fire NV Spark Brut/750ML/BTL2"],
      ["VIP Red wine（疑似轮换款，需与采购确认）", "Wine/Red/Aphelion Welkin Nero d'Avola/750ML/BTL 或 Wine/Red/Finisterre MR Cabernet Sauvignon/750ML/BTL"],
      ["VIP White wine", "⚠️ 尚未查到，需系统内搜索确认", true],
    ]},
    { cat: "烈酒 Liquor", rows: [
      ["Absolut Blue Vodka", "ZZZ/Liquor/Vodka/Absolut Blue/700ML/BTL"],
      ["Gin Beefeta", "ZZZ/Liquor/Gin/Beefeater Gin/700ML/BTL"],
      ["Tequila Gold", "ZZZ/Liquor/Tequila/Olmeca Gold/700ML/BTL"],
      ["Bacardi", "Liquor/Rum/Bacardi/1000ML/BTL"],
      ["Chivas", "ZZZ/Liquor/Scotch/Chivas Regal/700ML/BTL"],
      ["Jack Daniel", "ZZZ/Liquor/Bourbon/Jack Daniels/1LT/BTL2"],
      ["Aperol", "ZZZ/Liquor/Aperitif/Aperol/700ML/BTL"],
      ["Campari", "⚠️ 尚未查到，需系统内搜索确认", true],
      ["Angostrua Bitter", "⚠️ 尚未查到，需系统内搜索确认", true],
    ]},
  ];

  function toISO(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  // 周期边界是每天13:00——现在如果还没到今天13:00，就还算在"昨天13:00开始"那个周期里
  function periodKeyNow() {
    const now = new Date();
    const k = new Date(now);
    if (now.getHours() < 13) k.setDate(k.getDate() - 1);
    return toISO(k);
  }

  function nextResetLabel() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(13, 0, 0, 0);
    const sameDay = next > now;
    if (!sameDay) next.setDate(next.getDate() + 1);
    return (sameDay ? "今天" : "明天") + " 13:00";
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* fall through */ }
    return { periodKey: periodKeyNow(), checked: {} };
  }
  function save() { localStorage.setItem(STORE, JSON.stringify(data)); }

  let data = load();
  if (!data.checked || typeof data.checked !== "object") data.checked = {};

  function ensureFreshPeriod() {
    const pk = periodKeyNow();
    if (data.periodKey !== pk) {
      data.periodKey = pk;
      data.checked = {};
      save();
    }
  }

  function toggle(id) {
    data.checked[id] = !data.checked[id];
    save();
    render();
  }

  function buildList(container, items, countEl) {
    container.innerHTML = "";
    let doneCount = 0;
    let lastGroup = null;
    items.forEach(item => {
      if (item.group && item.group !== lastGroup) {
        const label = document.createElement("div");
        label.className = "check-group-label";
        label.textContent = item.group;
        container.appendChild(label);
        lastGroup = item.group;
      } else if (!item.group) {
        lastGroup = null;
      }
      const done = !!data.checked[item.id];
      if (done) doneCount++;

      const wrap = document.createElement("div");
      wrap.className = "check-item" + (item.group || item.indent ? " sub" : "");

      const row = document.createElement("div");
      row.className = "check-row" + (done ? " done" : "");
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.innerHTML = done
        ? '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : "";
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = item.text;
      row.append(mark, txt);

      if (item.images && item.images.length) {
        item.images.forEach(src => {
          const img = document.createElement("img");
          img.className = "thumb";
          img.src = src;
          img.loading = "lazy";
          img.alt = item.text;
          img.addEventListener("click", (e) => { e.stopPropagation(); openLightbox(src); });
          row.appendChild(img);
        });
      }

      row.addEventListener("click", () => toggle(item.id));
      wrap.appendChild(row);
      container.appendChild(wrap);
    });
    countEl.textContent = `${doneCount} / ${items.length}`;
    return { done: doneCount, total: items.length };
  }

  // 默认都是收起的（她自己点开要做的那一块）。只在某个板块刚好全部勾完时自动帮她收起来，
  // 没勾完的时候绝不主动展开——不然每次点一下勾就被强制弹开，跟"平时就是折叠的"这个诉求冲突。
  function applyAutoCollapse(detailsId, counts) {
    if (counts.done >= counts.total) document.getElementById(detailsId).open = false;
  }

  function render() {
    ensureFreshPeriod();
    document.getElementById("next-reset").textContent = nextResetLabel();
    applyAutoCollapse("pm-details", buildList(document.getElementById("pm-list"), PM_ITEMS, document.getElementById("pm-count")));
    applyAutoCollapse("rp-details", buildList(document.getElementById("rp-list"), REPORT_ITEMS, document.getElementById("rp-count")));
    applyAutoCollapse("rc-details", buildList(document.getElementById("rc-list"), RC_ITEMS, document.getElementById("rc-count")));
  }

  document.getElementById("reset-now-btn").addEventListener("click", () => {
    if (!confirm("确定要现在清空所有勾选吗？")) return;
    data.checked = {};
    data.periodKey = periodKeyNow();
    save();
    render();
  });

  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").hidden = false;
  }
  document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").hidden = true;
  });

  function renderLookup(keyword) {
    const kw = (keyword || "").trim().toLowerCase();
    const results = document.getElementById("lookup-results");
    results.innerHTML = "";
    let shown = 0;
    PRODUCT_LOOKUP.forEach(group => {
      const rows = kw
        ? group.rows.filter(r => r[0].toLowerCase().includes(kw) || r[1].toLowerCase().includes(kw))
        : group.rows;
      if (!rows.length) return;
      const catEl = document.createElement("div");
      catEl.className = "lookup-cat";
      catEl.textContent = group.cat;
      results.appendChild(catEl);
      rows.forEach(([par, full, warn]) => {
        shown++;
        const row = document.createElement("div");
        row.className = "lookup-row" + (warn ? " warn" : "");
        const parEl = document.createElement("div");
        parEl.className = "par";
        parEl.textContent = par;
        const fullEl = document.createElement("div");
        fullEl.className = "full";
        fullEl.textContent = full;
        row.append(parEl, fullEl);
        results.appendChild(row);
      });
    });
    if (!shown) {
      const empty = document.createElement("div");
      empty.className = "lookup-empty";
      empty.textContent = "没找到，换个关键词试试";
      results.appendChild(empty);
    }
  }
  document.getElementById("lookup-search").addEventListener("input", (e) => renderLookup(e.target.value));
  renderLookup("");

  render();
  // 万一这个页面开着跨过了下午1点，每分钟检查一次要不要清空——
  // 只在真的要清空时才整页重新 render，平时不重新 render，这样她手动展开一个
  // 已经打完勾的板块看一眼，不会过一分钟又被自动收起来
  setInterval(() => {
    if (periodKeyNow() !== data.periodKey) render();
    else document.getElementById("next-reset").textContent = nextResetLabel();
  }, 60000);
</script>
</body>
</html>
